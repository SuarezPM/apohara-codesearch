[package]
name = "apohara-indexer"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Offline hybrid (BM25 + vector) code-search indexing engine — SQLite FTS5 + sqlite-vec + tree-sitter + a blake3 feature-hash embedder. The library core behind apohara-codesearch."
keywords = ["code-search", "bm25", "tree-sitter", "sqlite", "embeddings"]
categories = ["development-tools", "text-processing"]

[lib]
name = "apohara_indexer"
path = "src/lib.rs"

[features]
# OFF by default (the default build ships no model). When enabled, compiles the
# feature-gated real embedders in `embedder.rs` / `embedder_gemma.rs`, which load
# a USER-SUPPLIED local model directory from disk (std::fs/mmap only — NO network,
# NO hf-hub). Primary backend (v0.8): `EmbeddingGemmaEmbedder` — a from-scratch
# pure-candle forward pass of EmbeddingGemma-300m (Gemma3 encoder + dense head),
# validated to cosine 0.99998 vs the official ONNX reference; 256d Matryoshka,
# asymmetric query/document prompts. (The legacy `GgufEmbedder` candle-BERT path
# is also gated here.) Pulls candle-core/candle-nn/candle-transformers/tokenizers
# as OPTIONAL, feature-gated deps so the DEFAULT build keeps zero ML/model crates
# (`cargo tree -e normal` asserts it) and the feature-hash default stays
# byte-identical. The name is historical ("gguf"); the shipped path loads
# safetensors, not GGUF.
gguf-embed = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
# rusqlite "bundled" statically compiles SQLite + extension support;
# "load_extension" enables sqlite3_auto_extension via ffi (see
# storage.rs::ensure_vec_extension_registered).
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-go = { workspace = true }
blake3 = { workspace = true }
dirs = { workspace = true }
# `ignore` powers the later walker (gitignore-aware filesystem traversal).
ignore = { workspace = true }
# `serde_json` serializes the multi-repo sidecar registry (path -> index map).
# Pure-Rust, no network — keeps the offline niche intact.
serde_json = { workspace = true }

# OPTIONAL, gguf-embed-feature-gated ML stack for the real BERT forward-pass
# (US-1B). None of these compile in the DEFAULT build (the `cargo tree -e normal`
# gate asserts zero ML crates). All load weights from a LOCAL path via std::fs /
# mmap only — NO `hf-hub`, NO network at build or runtime. Device::Cpu only, so
# no CUDA build dependency. Pinned to a set that resolves together (candle 0.10
# family + tokenizers 0.23). `tokenizers` uses `onig` (default) for the
# pretrained tokenizer.json regexes.
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.23", optional = true }

[dev-dependencies]
tempfile = "3"
