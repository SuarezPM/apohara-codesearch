# Apohara Codesearch Workflow Add New Tree Sitter Grammar

## Action

Follow the add-new-tree-sitter-grammar workflow:
1. Add new tree-sitter-<lang> dependency to workspace (Cargo.toml, Cargo.lock, crates/apohara-indexer/Cargo.toml).
2. Update parser logic to support new Language variant (crates/apohara-indexer/src/parser.rs, incremental.rs).
3. Add language detection and extraction logic (parser.rs, incremental.rs).
4. Add new test fixtures for the language (crates/apohara-indexer/tests/fixtures/fixture.<ext>, imports.<ext>).
5. Write unit tests for detection, extraction, and import logic (crates/apohara-indexer/src/parser.rs, tests/).
6. Add new fuzz target and update fuzz/Cargo.toml (fuzz/fuzz_targets/parse_<lang>_source.rs, fuzz/fuzz_targets/parse_source.rs).
7. Update integration tests if necessary (e.g., integration.rs for extension handling).
8. Document binary size impact and test results in commit message.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~5x per month
- Files: Cargo.toml, Cargo.lock, crates/apohara-indexer/Cargo.toml

