# Apohara Codesearch Workflow Freeze Benchmark Corpus And Guard

## Action

Follow the freeze-benchmark-corpus-and-guard workflow:
1. Copy or update files in tests/fixtures/bench-corpus-frozen-*/.
2. Add or update guard test to check content hashes (crates/apohara-codesearch/tests/corpus_freeze.rs).
3. Update or add relevant dev-dependencies (e.g., sha2 in Cargo.toml, Cargo.lock).
4. Document the freeze and hashes in commit message and/or BENCHMARK.md.

