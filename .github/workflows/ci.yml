# CI: lint, format, and test on every PR and on pushes to main.
# This is a SEPARATE lane from release.yml, which owns dist build/host/release.
# Here we only run fmt/clippy/test plus a `dist plan` sanity check (no build).
name: CI

on:
  pull_request: {}
  push:
    branches: [main]

# Least privilege: read-only token by default. No job here needs write.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Format
        run: cargo fmt --all --check

      # --all-features so the opt-in surfaces are covered too: the `bench`
      # feature (bench-search dev binary) and the `gguf-embed` feature. The
      # default-feature shipping config is exercised by release.yml's dist build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # --all-targets so the bench-search EXAMPLE's tests run too; --all-features
      # for the gguf-embed opt-in surface.
      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Install dist
        # bash gives us pipefail so a failing curl is caught (matches release.yml)
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"

      - name: dist plan
        run: dist plan

      # NOTE: the previous `dist generate --check` drift guard is intentionally
      # dropped. release.yml is hand-pinned to action commit SHAs for OpenSSF
      # Scorecard's Pinned-Dependencies check, which `dist generate` does not do —
      # so a regeneration would always report (spurious) drift. If you bump the
      # dist version or change [workspace.metadata.dist], re-run `dist generate`
      # and then re-apply the SHA pins to release.yml.

  # Locks the project's core invariant: the DEFAULT build makes no network
  # calls. It asserts the resolved normal-dependency tree links no HTTP client
  # crate (reqwest/hyper/ureq/curl/hf-hub/isahc/attohttpc). tokio is present as
  # the async runtime for the stdio MCP transport + file watcher, which is fine;
  # an HTTP client is not. A future edit that drags one in breaks this job.
  offline-isolation:
    name: offline isolation (no HTTP client in default build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Assert the default build links no HTTP client
        run: |
          tree="$(cargo tree -e normal)"
          if echo "$tree" | grep -qiE 'reqwest|hyper|ureq|curl|hf-hub|isahc|attohttpc'; then
            echo "::error::default build pulled an HTTP client — the offline invariant is broken."
            echo "$tree" | grep -iE 'reqwest|hyper|ureq|curl|hf-hub|isahc|attohttpc'
            exit 1
          fi
          echo "ok: the default build links no HTTP client"

  # Dependency-license / advisory / source policy. Uses the repo's deny.toml
  # (`[graph] all-features = true`, so the opt-in gguf-embed/candle tree is
  # covered too). Reviewed advisory exceptions live in deny.toml.
  deny:
    name: deny (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check

  # Vulnerability scan of the dependency tree (RUSTSEC). The single documented
  # exception (RUSTSEC-2024-0436, `paste` unmaintained, opt-in tree only) is
  # mirrored from deny.toml as an --ignore flag. Re-evaluate on each candle bump.
  audit:
    name: audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-audit
        # Pinned to the version in Cargo.lock (line matching `cargo-audit = "..."`).
        # `--locked` pins transitive deps to Cargo.lock; the explicit --version makes
        # the crate version itself a hash-equivalent pin and is the closest thing to
        # `cargo install --git <repo>@<sha>` that scorecard recognises as pinned-by-hash.
        run: cargo install cargo-audit --locked --version "^0.22.2"
      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2024-0436
