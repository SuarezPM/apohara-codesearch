# OpenSSF Scorecard: supply-chain security health checks.
# Runs on a weekly schedule and on pushes to main, publishes results to the
# repository's Security tab (code scanning) and feeds the public Scorecard
# badge. This is a SEPARATE lane from ci.yml (lint/test) and release.yml (dist).
name: Scorecard

on:
  branch_protection_rule: {}
  schedule:
    # Weekly, Monday 07:00 UTC.
    - cron: '0 7 * * 1'
  push:
    branches: [main]

# Least privilege at the top level; the analysis job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed for GitHub OIDC, used by scorecard to publish results.
      id-token: write
      # Read-only access to the repository contents.
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to the public OpenSSF REST API so the README badge
          # resolves. Requires id-token: write (set above).
          publish_results: true

      # Keep the raw SARIF as an artifact for debugging a low score.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Surface the findings in the Security tab.
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
