# ClusterFuzzLite: build and run the cargo-fuzz targets (fuzz/) against the
# code changed in a PR. Catches parser/chunker crashes on untrusted input before
# merge. A SEPARATE lane from ci.yml / codeql.yml / scorecard.yml.
name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    branches: [main]

# Least privilege: read-only token; the runner posts results via the implicit
# GITHUB_TOKEN passed below, not via elevated workflow permissions.
permissions:
  contents: read

jobs:
  PR:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build Fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run Fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
