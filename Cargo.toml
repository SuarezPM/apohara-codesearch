# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "2"
members = [
    "crates/apohara-indexer",
    "crates/apohara-codesearch",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Pablo M. Suarez <suarezpm@csnat.unt.edu.ar>"]
repository = "https://github.com/SuarezPM/apohara-codesearch"
homepage = "https://github.com/SuarezPM/apohara-codesearch#readme"

# Single source of version truth for deps shared across workspace crates.
# Versions are pinned to match the upstream apohara-indexer soft-fork source.
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
# rusqlite "bundled" statically compiles SQLite + extension support;
# "load_extension" enables sqlite3_auto_extension via ffi (see
# storage.rs::ensure_vec_extension_registered).
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
sqlite-vec = "0.1"
tree-sitter = "0.26"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-cpp = "0.23"
blake3 = "1.5"
dirs = "6.0"
ignore = "0.4"
serde_json = "1.0"

# The profile that 'dist' builds release artifacts with. dist init emits this
# alongside the metadata table below; the release workflow's `dist build` reads
# it. Inherits release; thin LTO trims the static SQLite + tree-sitter blobs.
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# SLSA Build L3 provenance: dist wires GitHub's actions/attest@v4 into the
# generated workflow and elevates the job permissions (id-token: write,
# attestations: write). No hand-editing of release.yml — dist owns it.
github-attestations = true
# Phase "build-local-artifacts" (dist's default) is the strongest SLSA chain:
# each platform attests its OWN binary at build time, before upload — rather
# than attesting the assembled set afterwards. No filters: attest all artifacts.
github-attestations-phase = "build-local-artifacts"
# release.yml is hand-edited after generation: GitHub Actions are pinned to commit
# SHAs and token permissions are split to least-privilege per-job (OpenSSF
# Scorecard Pinned-Dependencies + Token-Permissions). `allow-dirty = ["ci"]` tells
# dist not to flag the workflow as out-of-date in `dist plan` / `dist generate`.
# After any `dist generate`, re-apply the SHA pins + per-job permissions.
allow-dirty = ["ci"]

# Cross-compile the Windows MSVC target via cargo-xwin inside the maintained
# messense/cargo-xwin container (cc-built bundled SQLite links the MSVC CRT
# headers/libs xwin provisions). aarch64-linux needs no custom runner — dist
# selects cargo-zigbuild for it automatically.
[workspace.metadata.dist.github-custom-runners.x86_64-pc-windows-msvc]
container = "messense/cargo-xwin"
